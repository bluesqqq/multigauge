name: Deploy Firmware

on:
  push:
    tags:
      - 'ports-esp32@*'

permissions:
  contents: write

jobs:
  deploy-firmware:
    name: Build & Publish ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup PlatformIO
        uses: platformio/install-platformio-action@v1

      - name: Build Firmware
        run: pio run -d ports/esp32 -e esp32-s3-devkitc-1

      - name: Upload Firmware Bin to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ports/esp32/.pio/build/esp32-s3-devkitc-1/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
