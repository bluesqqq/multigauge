name: Deploy Firmware

on:
  push:
    tags:
      - 'ports-esp32@*'

permissions:
  contents: write

jobs:
  deploy-firmware:
    name: Build & Publish ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Cache PlatformIO, Pip & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.cache/ccache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        env:
          PLATFORMIO_BUILD_CACHE_DIR: ~/.cache/ccache
        run: pio run -d ports/esp32 -e esp32-s3-devkitc-1

      - name: Upload Firmware Bin to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ports/esp32/.pio/build/esp32-s3-devkitc-1/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}