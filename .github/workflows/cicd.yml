name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  core:
    name: Core
    uses: ./.github/workflows/build-core.yml
    with:
      fetch_depth: 1
      build_type: Debug
      build_target: multigauge_ci

  firmware:
    name: Firmware
    needs: core
    uses: ./.github/workflows/build-firmware.yml
    with:
      fetch_depth: 1
      upload_artifact: true

  web:
    name: Web
    needs: core
    uses: ./.github/workflows/build-web.yml
    with:
      fetch_depth: 1
      build_type: Debug
      upload_artifact: true

  release:
    name: Release
    needs:
      - core
      - firmware
      - web
    if: ${{ github.event_name == 'push' && github.ref_name == 'fix/failing-release-coordinator' && (contains(join(github.event.commits.*.added, ','), '.changeset/') || contains(join(github.event.commits.*.modified, ','), '.changeset/')) }}
    runs-on: ubuntu-latest
    outputs:
      firmware_tag: ${{ steps.detect-tags.outputs.firmware_tag }}
      website_tag: ${{ steps.detect-tags.outputs.website_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Version PR or Publish Tags
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Detect Created Release Tags
        id: detect-tags
        shell: bash
        run: |
          firmware_tag="$(git tag --points-at HEAD | grep -E '^ports-esp32@' | head -n 1 || true)"
          website_tag="$(git tag --points-at HEAD | grep -E '^ports-web@' | head -n 1 || true)"

          echo "firmware_tag=$firmware_tag" >> "$GITHUB_OUTPUT"
          echo "website_tag=$website_tag" >> "$GITHUB_OUTPUT"

  firmware_release:
    name: Firmware Release
    needs: release
    if: needs.release.outputs.firmware_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: multigauge-firmware
          path: firmware-artifact

      - name: Upload Firmware Bin to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.firmware_tag }}
          files: firmware-artifact/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

  website_release:
    name: Website Release
    needs: release
    if: needs.release.outputs.website_tag != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: multigauge-web
          path: web-artifact

      - name: Package Web Bundle into a ZIP
        run: |
          Compress-Archive -Path "web-artifact/*" -DestinationPath "ports-web-dist.zip" -Force

      - name: Upload Web WASM Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.website_tag }}
          files: ports-web-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}
