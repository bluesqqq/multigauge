name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - fix/failing-release-coordinator

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  coordinate:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      firmware_tag: ${{ steps.detect-tags.outputs.firmware_tag }}
      website_tag: ${{ steps.detect-tags.outputs.website_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Version PR or Publish Tags
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Detect Created Release Tags
        id: detect-tags
        shell: bash
        run: |
          firmware_tag="$(git tag --points-at HEAD | grep -E '^ports-esp32@' | head -n 1 || true)"
          website_tag="$(git tag --points-at HEAD | grep -E '^ports-web@' | head -n 1 || true)"

          echo "firmware_tag=$firmware_tag" >> "$GITHUB_OUTPUT"
          echo "website_tag=$website_tag" >> "$GITHUB_OUTPUT"

  firmware:
    needs: coordinate
    if: needs.coordinate.outputs.firmware_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download Firmware Artifact From CI
        uses: actions/download-artifact@v4
        with:
          name: multigauge-firmware
          path: firmware-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Upload Firmware Bin to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.coordinate.outputs.firmware_tag }}
          files: firmware-artifact/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

  website:
    needs: coordinate
    if: needs.coordinate.outputs.website_tag != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download Web Artifact From CI
        uses: actions/download-artifact@v4
        with:
          name: multigauge-web
          path: web-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Package Web Bundle into a ZIP
        run: |
          Compress-Archive -Path "web-artifact/*" -DestinationPath "ports-web-dist.zip" -Force

      - name: Upload Web WASM Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.coordinate.outputs.website_tag }}
          files: ports-web-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}
