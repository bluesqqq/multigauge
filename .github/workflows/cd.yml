name: CD

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Version PR or Release
    runs-on: ubuntu-latest

    outputs:
      firmware_tag: ${{ steps.detect-tags.outputs.firmware_tag }}
      website_tag: ${{ steps.detect-tags.outputs.website_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create Version PR or Publish Tags
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset tag
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Detect Created Release Tags
        id: detect-tags
        if: ${{ steps.changesets.outputs.published == 'true' }}
        shell: bash
        run: |
          firmware_tag="$(
            git tag --points-at HEAD |
            grep -E '^ports-esp32@' |
            head -n 1 ||
            true
          )"

          website_tag="$(
            git tag --points-at HEAD |
            grep -E '^ports-web@' |
            head -n 1 ||
            true
          )"

          echo "firmware_tag=$firmware_tag" >> "$GITHUB_OUTPUT"
          echo "website_tag=$website_tag" >> "$GITHUB_OUTPUT"

          echo "Firmware tag: ${firmware_tag:-none}"
          echo "Website tag: ${website_tag:-none}"

  firmware_release:
    name: Firmware Release
    needs: release

    if: ${{ needs.release.outputs.firmware_tag != '' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: multigauge-firmware
          path: firmware-artifact

      - name: Attach Artifact to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.firmware_tag }}
          files: firmware-artifact/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

  website_release:
    name: Website Release
    needs: release

    if: ${{ needs.release.outputs.website_tag != '' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: multigauge-web
          path: web-artifact

      - name: Package Artifact as ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "web-artifact/*" `
            -DestinationPath "ports-web-dist.zip" `
            -Force

      - name: Attach Artifact to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.website_tag }}
          files: ports-web-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}