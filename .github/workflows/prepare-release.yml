name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply when explicit_version is empty
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      explicit_version:
        description: Explicit version to release, without leading v
        required: false
        type: string
      release_notes:
        description: Manual GitHub release notes. If empty, commits since the previous release tag are used.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Update VERSION and tag release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MULTIGAUGE_RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate release version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.explicit_version }}
        run: |
          set -euo pipefail

          current_version="$(tr -d '[:space:]' < VERSION)"

          if [[ -n "$EXPLICIT_VERSION" ]]; then
            new_version="${EXPLICIT_VERSION#v}"
          else
            IFS='.' read -r major minor patch <<< "$current_version"
            case "$BUMP" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unsupported bump: $BUMP" >&2
                exit 1
                ;;
            esac
            new_version="${major}.${minor}.${patch}"
          fi

          if [[ ! "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: $new_version" >&2
            exit 1
          fi

          if git rev-parse "v${new_version}" >/dev/null 2>&1; then
            echo "Tag v${new_version} already exists" >&2
            exit 1
          fi

          python3 - "$current_version" "$new_version" <<'PY'
          import re
          import sys

          current, candidate = sys.argv[1], sys.argv[2]

          def parts(version: str) -> tuple[tuple[int, int, int], bool]:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?", version)
              if not match:
                  raise SystemExit(f"Invalid SemVer version: {version}")
              return tuple(int(part) for part in match.groups()), "-" in version

          current_numbers, current_is_prerelease = parts(current)
          candidate_numbers, candidate_is_prerelease = parts(candidate)

          if candidate_numbers < current_numbers:
              raise SystemExit(f"Release version {candidate} is older than current VERSION {current}")
          if candidate_numbers == current_numbers:
              if candidate == current:
                  raise SystemExit(f"Release version {candidate} already matches current VERSION")
              if candidate_is_prerelease or not current_is_prerelease:
                  raise SystemExit(f"Release version {candidate} is not newer than current VERSION {current}")
          PY

          echo "$new_version" > VERSION
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add VERSION
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Build release notes
        id: notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"

          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          else
            previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [[ -n "$previous_tag" ]]; then
              {
                echo "Changes since ${previous_tag}:"
                echo
                git log --first-parent --pretty='- %s (%h)' "${previous_tag}..HEAD"
              } > "$notes_file"
            else
              {
                echo "Initial unified release."
                echo
                git log --first-parent --pretty='- %s (%h)'
              } > "$notes_file"
            fi
          fi

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -F "${{ steps.notes.outputs.file }}"
          git push origin "${{ steps.version.outputs.tag }}"
