name: Web Build

on:
  workflow_call:
    inputs:
      fetch_depth:
        type: number
        default: 1
      build_type:
        type: string
        default: Debug
      upload_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ github.job }}-${{ runner.os }}

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
            -DMULTIGAUGE_BUILD_WEB=ON `
            -DMULTIGAUGE_REQUIRE_WEB=ON

      - name: Build
        run: cmake --build build --config ${{ inputs.build_type }} --target multigauge_ci -j $(nproc)

      - name: Publish web bundle
        run: ./scripts/publish-web-assets.ps1

      - name: Verify published web bundle
        run: |
          if (-not (Test-Path "apps/website/static/multigauge-web/js/pageRenderer.js")) {
            throw "Missing published pageRenderer.js"
          }
          if (-not (Test-Path "apps/website/static/multigauge-web/wasm/multigauge.js")) {
            throw "Missing published multigauge.js"
          }
          if (-not (Test-Path "apps/website/static/multigauge-web/wasm/multigauge.wasm")) {
            throw "Missing published multigauge.wasm"
          }

      - name: Upload Web Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: multigauge-web
          path: apps/website/static/multigauge-web
