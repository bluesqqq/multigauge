name: Firmware Build

on:
  workflow_call:
    inputs:
      fetch_depth:
        type: number
        default: 1
      upload_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Firmware build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Cache PlatformIO, Pip & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.cache/ccache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        env:
          PLATFORMIO_BUILD_CACHE_DIR: ~/.cache/ccache
        run: pio run -d ports/esp32 -e esp32-s3-devkitc-1

      - name: Upload Firmware Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: multigauge-firmware
          path: ports/esp32/.pio/build/esp32-s3-devkitc-1/firmware.bin
