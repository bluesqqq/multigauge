name: Deploy Website

on:
  push:
    tags:
      - 'ports-web@*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-web.yml
    with:
      fetch_depth: 0
      build_type: Release
      upload_artifact: true

  publish:
    name: Package and Upload Web Bundle
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: multigauge-web
          path: web-artifact

      - name: Package Web Bundle into a ZIP
        run: |
          Compress-Archive -Path "web-artifact/*" -DestinationPath "ports-web-dist.zip" -Force

      - name: Upload Web WASM Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ports-web-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
