<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multigauge Workspace</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-a: #0f1724;
      --bg-b: #16111d;
      --panel: #1f2431;
      --panel-2: #171c27;
      --panel-3: #101521;
      --border: #334055;
      --text: #f5f7fb;
      --muted: #b4bfd0;
      --accent: #f97316;
      --shadow: rgba(0, 0, 0, 0.35);
      --font: Arial, Helvetica, sans-serif;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(249, 115, 22, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.14), transparent 30%),
        linear-gradient(180deg, var(--bg-a), var(--bg-b));
      color: var(--text);
      font-family: var(--font);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    button,
    select {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }

    button {
      padding: 10px 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.active {
      background: #2e1c13;
      border-color: var(--accent);
    }

    button:disabled,
    select:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(8px);
    }

    .group {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .group-title {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      display: grid;
      gap: 8px;
      align-content: start;
      justify-items: end;
      text-align: right;
      color: var(--muted);
      font-size: 14px;
    }

    .status strong {
      color: var(--text);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.22);
      color: var(--muted);
      font-size: 12px;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    .viewport {
      position: absolute;
      inset: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px var(--shadow);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.06), transparent 62%),
        var(--panel-3);
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .viewport.dragging {
      cursor: grabbing;
    }

    .workspace {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      align-items: flex-start;
      gap: var(--workspace-gap, 24px);
      transform: translate(calc(-50% + var(--pan-x, 0px)), calc(-50% + var(--pan-y, 0px)));
      will-change: transform;
    }

    .gauge-card {
      display: block;
      min-width: 0;
    }

    .shell {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%),
        rgba(12, 16, 24, 0.9);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28);
    }

    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: inherit;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    @media (max-width: 1100px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .status {
        grid-column: 1 / -1;
        justify-items: start;
        text-align: left;
      }
    }
  </style>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <header class="toolbar">
    <div class="group">
      <div class="group-title">Gauge Sizes</div>
      <div class="button-row" id="size-group"></div>
    </div>

    <div class="status" id="status" aria-live="polite">
      <div class="pill" id="view-pill">Wheel to zoom, drag to pan</div>
      <div id="metrics"></div>
    </div>
  </header>

  <main class="stage">
    <div id="viewport" class="viewport">
      <div id="workspace" class="workspace"></div>
    </div>
  </main>

  <script type="module">
    import "../../dist/js/pageRenderer.js";

    (async function() {
      const sizeOptions = [
        { label: "240x240", width: 240, height: 240 },
        { label: "360x180", width: 360, height: 180 },
        { label: "480x480", width: 480, height: 480 }
      ];

      const gaugeCards = [
        { id: "gauge-a", label: "Gauge A", sizeIndex: 0 },
        { id: "gauge-b", label: "Gauge B", sizeIndex: 2 }
      ];

      const ui = {
        viewport: document.getElementById("viewport"),
        workspace: document.getElementById("workspace"),
        sizeGroup: document.getElementById("size-group"),
        viewPill: document.getElementById("view-pill"),
        metrics: document.getElementById("metrics")
      };

      const state = {
        zoom: 1,
        panX: 0,
        panY: 0,
        dragActive: false,
        dragStartX: 0,
        dragStartY: 0,
        startPanX: 0,
        startPanY: 0,
        runtimeByCardId: new Map(),
        cardStates: new Map()
      };

      function sizeLabel(size) {
        return size.width + "x" + size.height;
      }

      function formatPercent(value) {
        return Math.round(value * 100) + "%";
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updateReadout() {
      ui.viewPill.textContent = "Workspace zoom " + formatPercent(state.zoom) + " | Pan " + Math.round(state.panX) + ", " + Math.round(state.panY);
      ui.metrics.innerHTML = "<strong>Intrinsic size</strong> stays authored while the viewport scales it";
    }

      function applyWorkspaceTransform() {
      ui.workspace.style.setProperty("--pan-x", Math.round(state.panX) + "px");
      ui.workspace.style.setProperty("--pan-y", Math.round(state.panY) + "px");
      ui.workspace.style.setProperty("--workspace-gap", Math.max(12, Math.round(24 * state.zoom)) + "px");
      updateReadout();
    }

      function makeCardShell(cardState) {
        const width = Math.max(1, Math.round(cardState.size.width * state.zoom));
        const height = Math.max(1, Math.round(cardState.size.height * state.zoom));
        cardState.shell.style.width = width + "px";
        cardState.shell.style.height = height + "px";
        cardState.canvas.style.width = "100%";
        cardState.canvas.style.height = "100%";
      }

      function updateAllCards() {
        for (const cardState of state.cardStates.values()) {
          makeCardShell(cardState);
          const runtime = state.runtimeByCardId.get(cardState.id);
          if (runtime && typeof runtime.setRenderMode === "function") {
            runtime.setRenderMode(
              "intrinsic",
              Math.max(1, Math.round(cardState.size.width)),
              Math.max(1, Math.round(cardState.size.height))
            );
          }
        }
        applyWorkspaceTransform();
      }

      function createCard(cardConfig) {
        const card = document.createElement("section");
        card.className = "gauge-card";

        const shell = document.createElement("div");
        shell.className = "shell";

        const canvas = document.createElement("canvas");
        shell.appendChild(canvas);

        card.appendChild(shell);
        ui.workspace.appendChild(card);

        const cardState = {
          id: cardConfig.id,
          name: cardConfig.label,
          sizeIndex: cardConfig.sizeIndex,
          size: sizeOptions[cardConfig.sizeIndex],
          shell: shell,
          canvas: canvas,
        };
        state.cardStates.set(cardConfig.id, cardState);

        return cardState;
      }

      function setZoom(value) {
        state.zoom = clamp(value, 0.5, 2);
        updateAllCards();
      }

      function setPan(x, y) {
        state.panX = clamp(x, -800, 800);
        state.panY = clamp(y, -600, 600);
        applyWorkspaceTransform();
      }

      ui.viewport.addEventListener("pointerdown", function(event) {
        state.dragActive = true;
        state.dragStartX = event.clientX;
        state.dragStartY = event.clientY;
        state.startPanX = state.panX;
        state.startPanY = state.panY;
        ui.viewport.classList.add("dragging");
        ui.viewport.setPointerCapture(event.pointerId);
      });

      ui.viewport.addEventListener("pointermove", function(event) {
        if (!state.dragActive) return;
        const dx = event.clientX - state.dragStartX;
        const dy = event.clientY - state.dragStartY;
        setPan(state.startPanX + dx, state.startPanY + dy);
      });

      function endDrag(event) {
        state.dragActive = false;
        ui.viewport.classList.remove("dragging");
        try {
          ui.viewport.releasePointerCapture(event.pointerId);
        } catch (_) {}
      }

      ui.viewport.addEventListener("pointerup", endDrag);
      ui.viewport.addEventListener("pointercancel", endDrag);
      ui.viewport.addEventListener("pointerleave", endDrag);

      ui.viewport.addEventListener("wheel", function(event) {
        event.preventDefault();

        const nextZoom = clamp(state.zoom * Math.exp(-event.deltaY * 0.0025), 0.5, 2);
        if (nextZoom === state.zoom) {
          return;
        }

        const rect = ui.viewport.getBoundingClientRect();
        const pointerX = event.clientX - rect.left - rect.width / 2;
        const pointerY = event.clientY - rect.top - rect.height / 2;
        const ratio = nextZoom / state.zoom;

        state.panX = state.panX + pointerX * (1 - ratio);
        state.panY = state.panY + pointerY * (1 - ratio);
        state.zoom = nextZoom;
        updateAllCards();
      }, { passive: false });

      sizeOptions.forEach(function(option, index) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option.label;
        button.classList.toggle("active", index === 0);
        button.addEventListener("click", function() {
          Array.from(ui.sizeGroup.querySelectorAll("button")).forEach(function(other) {
            other.classList.toggle("active", other === button);
          });
          for (const cardState of state.cardStates.values()) {
            cardState.sizeIndex = index;
            cardState.size = option;
          }
          updateAllCards();
        });
        ui.sizeGroup.appendChild(button);
      });

      const mg = await Multigauge.init();
      const gaugeJson = await fetch("./gauge.json").then(function(response) {
        if (!response.ok) {
          throw new Error("Failed to load gauge.json");
        }
        return response.json();
      });

      for (const cardConfig of gaugeCards) {
        const cardState = createCard(cardConfig);
        const runtime = mg.createRuntime(cardState.canvas);
        runtime.load(JSON.parse(JSON.stringify(gaugeJson)));
        runtime.setRenderMode(
          "intrinsic",
          Math.max(1, Math.round(cardState.size.width)),
          Math.max(1, Math.round(cardState.size.height))
        );
        runtime.start();
        state.runtimeByCardId.set(cardConfig.id, runtime);
      }

      updateAllCards();
      setPan(0, 0);

      window.addEventListener("resize", function() {
        updateAllCards();
      });
    })().catch(function(err) {
      console.error(err);
      const status = document.getElementById("status");
      if (status) {
        status.textContent = "Failed to start";
      }
    });
  </script>
</body>
</html>
