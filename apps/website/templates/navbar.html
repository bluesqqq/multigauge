<nav class="navbar">
    <div class="navbar-inner page-container">
        <button
            class="navbar-menu-button"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="navbar-links"
        >
            <img
                src="/static/images/menu.png"
                data-menu-src="/static/images/menu.png"
                data-close-src="/static/images/close.png"
                class="navbar-menu-icon"
                alt=""
            >
        </button>

        <a href="/" class="navbar-brand" aria-label="Multigauge home">
            <img src="/static/images/multigauge-brandmark-light.svg" class="navbar-logo" alt="Multigauge">
        </a>

        <div class="navbar-links" id="navbar-links">
            <a href="/products">PRODUCTS</a>
            <a href="/workshop">WORKSHOP</a>
            <a href="/editor">EDITOR</a>

            {% if current_user.is_authenticated and current_user.is_admin() %}
            <a href="/admin">ADMIN</a>
            {% endif %}
        </div>

        <div class="navbar-actions">
            {% if current_user.is_authenticated %}
            <!-- Notifications here -->
            {% endif %}

            <a href="/account" aria-label="Account">
                <img src="/static/images/default_pfp.jpg" class="navbar-icon" alt="">
            </a>

            <a href="/cart" class="navbar-cart" aria-label="Cart">
                <img src="/static/images/cart.png" class="navbar-icon" alt="">
                <span class="navbar-cart-count">{{ cart_count }}</span>
            </a>
        </div>
    </div>
</nav>

<script>
    const navbar = document.querySelector(".navbar");
    const menuButton = document.querySelector(".navbar-menu-button");
    const menuIcon = document.querySelector(".navbar-menu-icon");

    menuButton.addEventListener("click", () => {
        const isOpen = navbar.classList.toggle("is-open");

        menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
        menuIcon.src = isOpen ? menuIcon.dataset.closeSrc : menuIcon.dataset.menuSrc;
    });
</script>
